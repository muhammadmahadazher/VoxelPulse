name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Smoke test (frame builder + processing)
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, 'backend')
          from app.main import _build_frame
          from app.telemetry_generator import TelemetryGenerator
          from app.processing import ransac_ground, grid_clusters
          g = TelemetryGenerator(5000)
          assert len(_build_frame(g)) > 1000
          f = g.step(1/30)
          m = ~ransac_ground(f.points.astype('float64'))
          assert 0 < m.sum() < len(f.points)
          assert len(grid_clusters(f.points[m].astype('float64'))) >= 0
          print("backend OK")
          EOF

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test
      - name: Type-check & build
        working-directory: frontend
        run: npm run build
