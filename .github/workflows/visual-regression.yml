name: Visual Regression

# Screenshot gates are heavier than unit CI: run on demand (and weekly) so
# PR latency stays low while still catching silent visual regressions.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Visual tests
        working-directory: frontend
        run: npx playwright test
        continue-on-error: true # first run has no baselines; failures upload below
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: frontend/tests/**/*-diff.png
          if-no-files-found: ignore
