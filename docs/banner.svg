<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b10"/><stop offset="1" stop-color="#141428"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF"/><stop offset="1" stop-color="#7000FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <!-- point cloud dots -->
  <g fill="#00F5FF">
    <circle cx="880" cy="210" r="2" opacity=".9"/><circle cx="905" cy="190" r="2.4" opacity=".8"/>
    <circle cx="930" cy="225" r="2" opacity=".7"/><circle cx="955" cy="175" r="2.6" opacity=".85"/>
    <circle cx="980" cy="200" r="2" opacity=".6"/><circle cx="1010" cy="230" r="2.4" opacity=".9"/>
    <circle cx="1040" cy="185" r="2" opacity=".75"/><circle cx="1065" cy="215" r="2.6" opacity=".8"/>
    <circle cx="1090" cy="165" r="2" opacity=".6"/><circle cx="1115" cy="235" r="2.2" opacity=".85"/>
    <circle cx="920" cy="245" r="1.8" opacity=".5"/><circle cx="990" cy="150" r="1.8" opacity=".5"/>
    <circle cx="1120" cy="195" r="2" opacity=".7"/><circle cx="860" cy="170" r="1.8" opacity=".55"/>
  </g>
  <!-- radar rings -->
  <circle cx="990" cy="200" r="60" fill="url(#glow)" opacity=".35"/>
  <circle cx="990" cy="200" r="60" fill="none" stroke="#7000FF" stroke-width="1.4"/>
  <circle cx="990" cy="200" r="100" fill="none" stroke="#00F5FF" stroke-width="1" opacity=".45"/>
  <circle cx="990" cy="200" r="140" fill="none" stroke="#00F5FF" stroke-width="0.8" opacity=".25"/>
  <!-- sweep line -->
  <line x1="990" y1="200" x2="1090" y2="130" stroke="#00F5FF" stroke-width="1.5" opacity=".8"/>
  <!-- box -->
  <rect x="940" y="185" width="60" height="36" fill="none" stroke="#39FF6A" stroke-width="1.5" rx="3"/>
  <text x="942" y="180" font-family="monospace" font-size="11" fill="#39FF6A">car 96%</text>
  <text x="70" y="140" font-family="'Segoe UI',sans-serif" font-size="72" font-weight="800" fill="url(#text)">VoxelPulse</text>
  <text x="74" y="185" font-family="monospace" font-size="18" fill="#94a3b8">real-time 3D lidar &amp; vision sensor fusion dashboard</text>
  <text x="74" y="230" font-family="monospace" font-size="14" fill="#475569">fastapi · websockets · numpy · three.js · react · zustand · framer-motion</text>
</svg>
